name: postmap-live

version: '3.8'

services:


  # ─────────────────────────────────────────────
  # 1. PostgreSQL / PostGIS
  # ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3
    container_name: postgis_server
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - monitoring_net

  # ─────────────────────────────────────────────
  # 2. Postgres Exporter (agent de métriques)
  # ─────────────────────────────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgrespassword@postgres:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - monitoring_net

  # ─────────────────────────────────────────────
  # 3. Prometheus (collecte des métriques)
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring_net

  # ─────────────────────────────────────────────
  # 4. Grafana (tableau de bord)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_server
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring_net

# ─────────────────────────────────────────────
# Réseau interne isolé pour la stack
# ─────────────────────────────────────────────
networks:
  monitoring_net:
    driver: bridge

# ─────────────────────────────────────────────
# Volumes persistants (survie aux redémarrages)
# ─────────────────────────────────────────────
volumes:
  pgdata:
  promdata:
  grafanadata:
